# Example wt config. Copy to ~/.config/wt/config.yaml and adjust.

# Where wt creates worktrees, as <worktrees_dir>/<repo>/<name>.
worktrees_dir: ~/worktrees

# Repo used when wt runs outside a git repo, such as from Rex or Raycast.
# A repo name from the list below, or a path.
default_repo: my-app

# Random branches are <branch_prefix>/<three words>. Empty uses your GitHub username.
# branch_prefix: your-name

# Repos without an entry get one shell tab.
repos:
  - path: ~/code/my-app
    layout: agent-dev # optional: name defaults to the folder name, here my-app

layouts:
  # An agent on the left, a dev server above a shell on the right.
  agent-dev:
    tabs:
      - title: dev
        root:
          split: horizontal # before is left of after; vertical puts before on top
          ratio: 0.6 # before's share of the space
          before:
            pane: agent
            input: claude # typed into the pane's shell; use command: [...] to run without a shell
          after:
            split: vertical
            before:
              pane: server
              dir: web # relative to the worktree
              input: npm run dev
            after:
              pane: shell
