# Example wt config. Copy to ~/.config/wt/config.yaml.

# Where wt creates worktrees, as <worktrees_dir>/<repo>/<name>.
worktrees_dir: ~/worktrees

# Repo used when wt runs outside a git repo, such as from Rex or Raycast.
default_repo: main

# Random branches are <branch_prefix>/<three words>. Empty uses your GitHub username.
# branch_prefix: backevik

repos:
  - path: ~/projects/work/main
    layout: main

layouts:
  # agent on the left, cli above git on the right.
  main:
    tabs:
      - title: frontend
        root:
          split: horizontal
          before:
            pane: agent
            input: opencode --auto
          after:
            split: vertical
            before:
              pane: cli
              dir: frontend
              input: pnpm run dev:init
            after:
              pane: git
